# CP進捗通知 — 基本設定
# 秘密情報はここに書かない。環境変数（.env）から読む。

cp_api:
  base_url: "https://api.careerplus.jp"
  api_key_env: "CP_NOTIFY_API_KEY"      # 値そのものは書かない

rate_limit:
  # CP の上限は 240 req/分。超えると API サービスを停止される可能性がある。
  # 既定は上限の 25%（60 req/分）。240 がキー単位かテナント単位かは未確認のため
  # 余裕を大きく取る（docs/design/06-open-questions.md Q-1）。
  tokens_per_second: 1.0                # = 60 req/分
  bucket_capacity: 20                   # 瞬間的に 20 連続まで
  warn_threshold_ratio: 0.8             # 80% を5分継続で超えたら警告

store:
  path: "var/state.sqlite3"
  log_dir: "var/logs"

limits:
  max_notifications_per_cycle: 50       # 超えたらサマリ通知に切り替える
  max_pages_per_cycle: 10               # 深い offset はタイムアウトのリスクがある
  http_timeout_seconds: 60

catchup:
  # 断続起動（PoC は手元 PC）からの再開時の挙動。仕様書 9.5
  catchup_max_window_days: 30
  notify_gap_to_ops: true
  gap_notify_threshold_minutes: 60      # これを超える停止があれば ops へ1通出す

# 通知本文に出す名前の解決（app/core/resolver.py・仕様書 5.3）。
# progress / progress_history が持っているのは ID だけなので、別リソースを select して
# 名前に直す。変化が遅いので TTL 付き LRU でキャッシュする。
#
# ⚠️ ここに担当者メールアドレス（CAREER#CHARGE_EMAIL）を足さないこと。
#    要件4の宛先であり、担当者変更の直後に旧担当へ送るのは実害がある（仕様書 5.3）。
name_resolution:
  career:
    resource: "career"
    items: ["CAREER#LASTNAME", "CAREER#FIRSTNAME"]
    template: "{CAREER#LASTNAME} {CAREER#FIRSTNAME}"
    ttl_seconds: 3600                   # 1時間
    max_entries: 2000
  order:
    resource: "order"
    items: ["ORDER#POSITIONNAME"]
    template: "{ORDER#POSITIONNAME}"
    ttl_seconds: 21600                  # 6時間
    max_entries: 1000
  client:
    # 進捗は PROGRESS#CLIENT_ID を直接持っているので、求人を経由せず 1 リクエストで引ける
    resource: "client"
    items: ["CLIENT#CLIENTNAME"]
    template: "{CLIENT#CLIENTNAME}"
    ttl_seconds: 21600                  # 6時間
    max_entries: 1000

notifiers:
  slack:
    # Incoming Webhook はチャンネルごとに1本。URL はチャンネルを特定する秘密情報
    webhooks:
      career_status: { url_env: "SLACK_WEBHOOK_CAREER_STATUS" }   # 要件1
      progress_flow: { url_env: "SLACK_WEBHOOK_PROGRESS_FLOW" }   # 要件2（未実装）
      job_intro:     { url_env: "SLACK_WEBHOOK_JOB_INTRO" }       # 要件3（未実装）
      ops:           { url_env: "SLACK_WEBHOOK_OPS" }             # 運用アラート・ドライラン

  # 要件4のメール送信はペンディング（仕様書 8.4）。
  # 再開時にここへ transport / host / port を書く。
  # mail:
  #   transport: "smtp"
  #   host: "localhost"                 # PoC は Mailpit
  #   port: 1025
  #   starttls: false
  #   auth: "none"
  #   from_address: "cp-notify@mybrainlab.net"
  #   admin_address: "a.yahara@mybrainlab.net"
